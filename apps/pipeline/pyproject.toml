[project]
name = "temnia-pipeline"
version = "0.0.0"
description = "Temnia media and editorial pipeline: Temporal workers, ffmpeg wrappers, harness sensors."
license-files = ["LICENSES/NLTK-3.10.3.txt", "LICENSES/Chapter-Llama-MIT.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "av>=18.1,<19",
    "boto3>=1.40,<2",
    "modal>=1.5.5,<2",
    "numpy>=2.3,<3",
    "obstore>=0.11.1,<0.12",
    "onnxruntime==1.29.0",
    "psycopg[binary,pool]>=3.3.5,<4",
    "pydantic>=2.13,<3",
    "pydantic-ai-slim[anthropic,google,openai,temporal]==2.40.0",
    "temporalio>=1.32,<2",
    # The substrate. torch is declared here rather than left to
    # sentence-transformers so the linux resolution can be pinned to the CPU
    # wheels below: the default PyPI wheel drags in the nvidia CUDA runtime,
    # about 2.5 GB the pipeline image would carry to run two small models on
    # a CPU.
    "ruptures>=1.1.10,<2",
    "sentence-transformers>=6.0.1,<7",
    "torch>=2.14,<3",
    "wtpsplit>=2.2.1,<3",
    "logfire>=5.1,<6",
]

[project.optional-dependencies]
scene-challenger = ["scenedetect-headless==0.7.1"]

[project.scripts]
temnia-eval = "temnia_pipeline.evals.runner:main"
temnia-harness = "temnia_pipeline.harness.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.40",
    "datamodel-code-generator>=0.76",
    "pyright>=1.1.411",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.4",
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

# torch publishes one wheel per accelerator. On linux the default is the CUDA
# build; the pipeline image and the Modal CPU functions want the CPU one, and
# macOS wheels on PyPI are already CPU-only, so the source is scoped to linux.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/temnia_pipeline/contracts.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter owns these.
    "COM812",
    "ISC001",
    # Module and package docstrings are not required; public symbols still are.
    "D100",
    "D104",
    # Google style docstrings (see convention below) do not want a blank line after the summary.
    "D203",
    "D213",
    # No copyright headers in this repository.
    "CPY001",
    # __init__ is documented by its class.
    "D107",
    # Small synchronous path operations (mkdir, a few KB of JSON) inside
    # activities that then await a subprocess for minutes; offloading them
    # to threads would add noise without changing anything measurable.
    "ASYNC240",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "INP001", "PLR2004"]
"scripts/**" = ["INP001"]
# ECMA-262's StringNumericLiteral grammar is a chain of early returns; folding
# it into one expression would hide which clause of the spec each answer is.
"src/temnia_pipeline/jsnum.py" = ["PLR0911"]
# The substrate is a line-for-line port whose output is compared byte for byte
# with the TypeScript's: the loops keep the shape of the functions they mirror
# (PERF401), and the typographic quotes are part of the ported regexes
# (RUF001, RUF003).
"src/temnia_pipeline/substrate/grid.py" = ["PERF401", "RUF001", "RUF003"]
# The eval scorers and their replay are line-for-line ports too, and the
# snapshots compare their output byte for byte. The spec constants stay inline
# where the TypeScript has them (PLR2004), the control flow keeps its shape
# (C901, PERF401, PLR0911, FBT001), and a docstring per scorer would restate
# the name: what each one means is its cases in tests/parity/ (D101, D103).
"src/temnia_pipeline/evals/parity.py" = ["D103", "PLR0911"]
"src/temnia_pipeline/evals/review_metrics.py" = ["D101", "D103"]
"src/temnia_pipeline/evals/runner.py" = ["D103"]
"src/temnia_pipeline/evals/scorers.py" = [
    "C901",
    "D101",
    "D103",
    "FBT001",
    "PERF401",
    "PLR2004",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
