function render(){stopPlayback();document.getElementById('app').classList.toggle('portal-active',state.portal);renderDock();const screens={map:mapScreen,cut:editScreen,review:reviewScreen,feedback:feedbackScreen,deliver:deliverScreen};workspace.innerHTML=`<div class="scene">${state.portal?portalScreen():screens[state.mode]()}</div>`;document.getElementById('location-label').textContent=state.portal?'Client review / version '+state.version:state.mode==='map'?'Source → Chapter '+chapters[state.selected].n:state.mode==='cut'?'Chapter 04 ↔ 05 / shared cut':'Chapter 04 → Moment / v'+state.version;document.querySelector('.app').style.minHeight=state.portal?'1000px':'';hydrateIcons();}
function go(mode){state.portal=false;state.mode=mode;state.selected=4;render();window.scrollTo(0,0);}
function toast(message){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,4800);}
function dialog(title,body){previousFocus=document.activeElement;overlay.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="${escape(title)}"><div class="dialog-head"><h2>${title}</h2><button class="icon-btn" data-action="close" aria-label="Close dialog">${icon('close')}</button></div>${body}</section>`;overlay.hidden=false;overlay.querySelector('button,input,textarea')?.focus();}
function close(){overlay.hidden=true;overlay.innerHTML='';if(previousFocus?.isConnected)previousFocus.focus();}
function stopPlayback(){clearInterval(playbackTimer);state.played=false;}
function startPlayback(join=false){if(state.played){stopPlayback();render();return;}state.played=true;let elapsed=join?1581:state.mode==='cut'?1583:18;const end=elapsed+4;const time=document.querySelector('.play-time');const btn=document.querySelector('[data-action="play"]');if(btn)btn.innerHTML=icon('pause');toast('Sample playhead preview · illustrative frame, no audio track');playbackTimer=setInterval(()=>{elapsed+=.1;if(time)time.textContent=tc(elapsed,true);const progress=document.querySelector('.transport-progress i');if(progress)progress.style.width=`${40+(elapsed-end+4)*10}%`;if(elapsed>=end){stopPlayback();if(btn)btn.innerHTML=icon('play');}},100);}
function newVersion(){state.version++;state.internal=false;state.client=false;state.reviewVersion=state.version;document.getElementById('save-state').textContent='Local draft v'+state.version+' saved';}
document.addEventListener('click',e=>{const mode=e.target.closest('[data-mode]');if(mode){close();go(mode.dataset.mode);return;}const chapter=e.target.closest('[data-chapter]');if(chapter){state.selected=Number(chapter.dataset.chapter);if(chapters[state.selected].drop){actions.drop();return;}if(state.selected!==4){actions.chapter();}else{render();}return;}const view=e.target.closest('[data-view]');if(view){state.mapView=view.dataset.view;render();return;}const tool=e.target.closest('[data-tool]');if(tool){state.tool=tool.dataset.tool;render();return;}const comment=e.target.closest('[data-comment]');if(comment){state.comment=Number(comment.dataset.comment);render();return;}const destination=e.target.closest('[data-destination]');if(destination){state.destination=destination.dataset.destination;render();return;}const action=e.target.closest('[data-action]');if(action&&actions[action.dataset.action])actions[action.dataset.action]();});
document.addEventListener('input',e=>{if(e.target.id==='boundary-range'){state.offset=Number(e.target.value);const time=tc(1584+state.offset/1000,true);document.querySelectorAll('.seam-time').forEach(el=>el.textContent=time);document.getElementById('transcript-cut').textContent=time;document.getElementById('blade').style.left=`${50+state.offset/20}%`;e.target.setAttribute('aria-valuetext',time);document.querySelector('[data-action="commit"]').disabled=state.offset===state.committedOffset;document.getElementById('boundary-msg').textContent=`Preview: one shared cut at ${time}. Coverage remains complete; both neighbours will be checked.`;}});
document.addEventListener('change',e=>{if(e.target.id==='caption-toggle'){state.caption=e.target.checked;newVersion();render();}if(e.target.id==='aspect'){const stage=document.querySelector('.media-stage');stage.style.aspectRatio=e.target.value;stage.style.maxHeight='330px';stage.style.maxWidth=e.target.value==='9/16'?'186px':e.target.value==='1/1'?'330px':'none';stage.style.margin='auto';toast('Aspect preview changed. The base edit stays selected.');}if(e.target.id==='audio-toggle')toast('Audio playback is not connected in this concept.');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();return;}if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();actions.command();return;}if(!overlay.hidden&&e.key==='Tab'){const focusable=[...overlay.querySelectorAll('button:not(:disabled),a,input,textarea,select')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if(overlay.hidden&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&e.altKey&&/^[1-5]$/.test(e.key)){e.preventDefault();go(modes[Number(e.key)-1][0]);}});
overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
const actions={
close,
projects(){dialog('Your workspaces',`<p>Work stays scoped to the active client, brand, and project.</p><span class="eyebrow">Fieldwork Studio / Northstar</span><button class="workspace-choice" data-action="current-project">${icon('folder')}<span><strong>The shape of good work · EP 024</strong><br><span class="small muted">Continue cutting · Chapter 04 · 42:18 source</span></span>${icon('arrow')}</button><div class="detail-line"><span>Brand</span><span>Northstar · Kit 02</span></div><div class="detail-line"><span>Campaign</span><span>Ideas at work / September</span></div><div class="action-row"><button class="btn quiet" data-action="atlas">Explore platform spaces</button><button class="btn primary" data-action="current-project">Return to episode</button></div>`);},
'current-project'(){close();go('map');},
command(){dialog('Go straight to the work',`<p>Keep the project and source selection across modes.</p>${modes.map(([id,label],i)=>`<button class="command-row" data-mode="${id}">${icon(id)} ${label}<span class="shortcut">⌥ ${i+1}</span></button>`).join('')}<button class="command-row" data-action="projects">${icon('folder')} Switch project</button><button class="command-row" data-action="atlas">${icon('map')} Platform spaces</button>`);},
atlas(){dialog('The rest of the studio',`<p>These spaces sit behind the workspace switcher. They are proposed surfaces, not implemented applications.</p>${[['Intake','Master uploads, resumable transfers, source groups, truthful processing queues.'],['Clients & brands','Client scopes, approved voice, visual kits, rights and brand memory.'],['Library & recipes','Grounded assets across sources; repeatable weekly deliverable sets.'],['Calendar & performance','Production, review and publishing events; performance traced to the source.'],['Agency settings','Members, permissions, audit records, budgets, billing and usage.']].map(([t,d])=>`<div class="atlas-item"><h3>${t}</h3><p>${d}</p></div>`).join('')}`);},
brief(){dialog('The episode brief',`<p>The strategist steers the episode before planning. A new plan is a deliberate action.</p><label class="form-label" for="brief-text">What should this episode preserve?</label><textarea id="brief-text">${escape(state.brief)}</textarea><div class="detail-line"><span>Coverage</span><span>Full source · keep / deliberate drop</span></div><div class="detail-line"><span>Moments</span><span>Grounded spans, linked to chapters</span></div><div class="action-row"><button class="btn primary" data-action="brief-save">Save sample brief</button></div>`);},
'brief-save'(){state.brief=document.getElementById('brief-text').value;close();toast('Brief saved locally. No planning run was started.');},
source(){const c=chapters[state.selected];dialog('Original source',`<p>The shape of good work · EP 024</p><div class="media-stage" style="border-radius:10px">${studio()}<span class="sample-stamp">ILLUSTRATIVE FOOTAGE</span></div><div class="detail-line"><span>Master duration</span><span class="mono">42:18</span></div><div class="detail-line"><span>Selected chapter</span><span>${escape(c.title)}</span></div><div class="detail-line"><span>Source range</span><span class="mono">${tc(c.start)}–${tc(c.end)}</span></div><div class="detail-line"><span>Tracks</span><span>Mix + Maya + Jonah</span></div><div class="action-row"><button class="btn primary" data-mode="cut">Open example cutting bench</button></div>`);},
chapter(){actions.source();},
drop(){dialog('A deliberate drop',`<div class="row" style="margin-bottom:20px"><span class="pill warn">Proposed drop</span><span class="mono">16:12–16:30 · 18 seconds</span></div><p>A short off-topic exchange about adjusting the room temperature. The proposal preserves the surrounding argument.</p><p>The source is retained. This range remains visible in the coverage record.</p><div class="action-row"><button class="btn quiet" data-action="close">Keep proposal</button><button class="btn primary" data-action="restore-drop">Restore as chapter</button></div>`);},
'restore-drop'(){chapters[3].drop=false;chapters[3].n='03b';chapters[3].title='Restored exchange';close();state.selected=4;newVersion();render();toast('18 seconds restored locally. Source coverage remains complete.');},
quote(){dialog('A quote with its source attached',`<div class="asset-preview quote" style="padding:30px;background:#c7c9bb;border-radius:10px;color:#293c35"><div style="font-family:'Barlow Condensed',sans-serif;font-size:36px;line-height:1.1">“Leave enough room<br>for the answer.”</div><p style="color:#536652;margin:16px 0 0">Maya · The shape of good work</p></div><div class="detail-line"><span>Evidence</span><span class="mono">26:09–26:15 · Chapter 04</span></div><div class="detail-line"><span>Brand context</span><span>Northstar · Kit 02</span></div><div class="action-row"><button class="btn" data-action="evidence">See original context</button><button class="btn primary" data-mode="feedback">Review feedback</button></div>`);},
written(){dialog('The episode package',`<p>A written workspace inherits the same chapter spine and source evidence.</p><div class="atlas-item"><h3>Title</h3><p>The shape of good work: making room for better answers</p></div><div class="atlas-item"><h3>Show notes</h3><p>Maya and Jonah discuss why teams overproduce, how to recognise a useful signal, and what a more thoughtful working week can look like. <span class="mono green">00:48–34:30</span></p></div><div class="atlas-item"><h3>Chapters</h3><p>${chapters.filter(c=>!c.drop).map(c=>`${tc(c.start)} &nbsp; ${c.title}`).join('<br>')}</p></div><div class="action-row"><button class="btn primary" data-action="evidence">Inspect sample evidence</button></div>`);},
evidence(){dialog('Follow it back to the source',`<span class="eyebrow">Original master → Chapter 04 → Moment v${state.version}</span><div class="media-stage" style="margin:18px 0;border-radius:10px">${studio()}<span class="sample-stamp">SOURCE RANGE · 25:48–26:30</span></div><p>“We tend to fill every quiet second. But the most useful thing you can do is leave enough room for the answer.”</p><div class="detail-line"><span>Quotation evidence</span><span>26:09–26:15 · transcript revision 1</span></div><div class="detail-line"><span>Evidence type</span><span>Direct quotation · illustrative data</span></div><div class="action-row"><button class="btn primary" data-mode="cut">Inspect chapter boundary</button></div>`);},
history(){dialog('Edit history',`<p>Each edit is a versioned specification. The original source stays intact.</p><div class="detail-line"><span>Current draft</span><span>v${state.version}</span></div><div class="detail-line"><span>Shared chapter cut</span><span class="mono">${tc(1584+state.committedOffset/1000,true)}</span></div><div class="detail-line"><span>Client-approved snapshot</span><span>${state.approvedVersion?'v'+state.approvedVersion:'No approved version yet'}</span></div><div class="action-row"><button class="btn" data-action="reset-boundary" ${state.committedOffset===0?'disabled':''}>Restore original cut as new draft</button></div>`);},
'reset-boundary'(){state.offset=0;state.committedOffset=0;chapters[4].end=1584;chapters[5].start=1584;newVersion();close();go('cut');toast('Original cut restored in a new local draft. Review is required again.');},
play(){startPlayback();},join(){startPlayback(true);},seek(){const el=document.querySelector('.play-time');if(el)el.textContent='26:09';toast('Sample playhead moved to the source phrase.');},
commit(){state.committedOffset=state.offset;chapters[4].end=1584+state.offset/1000;chapters[5].start=chapters[4].end;newVersion();render();toast(`Shared cut saved at ${tc(chapters[4].end,true)}. Both neighbours updated; draft v${state.version} needs review. Review the affected edges again.`);},
'caption-save'(){state.captionText=document.getElementById('caption-text').value.trim()||'Leave enough room for the answer.';newVersion();render();toast('Caption saved in a new local version. Review is required again.');},
'approve-internal'(){state.internal=true;render();toast(`Internal approval recorded for v${state.version}. Client review is next.`);},
portal(){state.portal=true;render();window.scrollTo(0,0);},'exit-portal'(){state.portal=false;render();},
'approve-client'(){if(!state.internal)return;state.client=true;state.approvedVersion=state.version;render();toast(`Sample client approval pinned to v${state.version}.`);},
'client-changes'(){dialog('Request a change',`<p>Your note will be visible to the studio in this sample session.</p><label class="form-label" for="client-note">What should change?</label><textarea id="client-note" placeholder="Add a note about this version…"></textarea><div class="action-row"><button class="btn primary" data-action="client-note-save">Add sample note</button></div>`);},
'client-note-save'(){const value=document.getElementById('client-note').value.trim();if(!value){document.getElementById('client-note').focus();return;}comments[0].text=value;state.resolved[0]=false;state.client=false;close();render();toast('Sample client note saved. Delivery is blocked pending approval.');},
'portal-evidence'(){const el=document.getElementById('portal-evidence');el.hidden=!el.hidden;},
'review-now'(){go('review');},
'edit-note'(){state.tool=state.comment===0?'cut':'captions';go('cut');},
resolve(){state.resolved[state.comment]=!state.resolved[state.comment];render();toast(state.resolved[state.comment]?'Note marked resolved. This does not approve the asset.':'Note reopened.');},
memory(){dialog('A memory worth keeping?',`<span class="eyebrow">Suggested from client feedback</span><p style="font-size:20px;color:var(--ink);margin-top:17px">“Allow a natural pause after an important answer.”</p><div class="detail-line"><span>Applies to</span><span>Northstar / editorial preferences</span></div><div class="detail-line"><span>Evidence</span><span>Leah’s note · EP 024 · v3 · 00:18</span></div><p style="margin-top:17px">A person must accept this preference before it can guide future work.</p><div class="action-row"><button class="btn quiet" data-action="memory-reject">Dismiss suggestion</button><button class="btn primary" data-action="memory-accept">Accept sample preference</button></div>`);},
'memory-accept'(){close();toast('Preference accepted locally for Northstar. No other client is affected.');},'memory-reject'(){close();toast('Suggestion dismissed locally.');},
package(){if(!state.client||state.approvedVersion!==state.version)return;const manifest={concept:true,project:'The shape of good work / EP 024',asset:'Leave room for the answer',version:state.version,approvedVersion:state.approvedVersion,sourceRange:{in:'25:48',out:'26:30'},destination:state.destination,notice:'Illustrative manifest only. No media rendered or published.'};dialog('Sample manifest prepared',`<p>The selected moment is approved as version ${state.approvedVersion}. This preview contains no media and publishes nothing.</p><pre style="white-space:pre-wrap;font-size:12px;color:var(--mint);background:#182822;padding:15px;border-radius:10px">${escape(JSON.stringify(manifest,null,2))}</pre><div class="action-row"><button class="btn primary" data-action="close">Done</button></div>`);}
};
render();
})();
</script>
</body>
</html>
